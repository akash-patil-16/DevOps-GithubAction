trigger: 
  branches:
    include:
      - feature
  paths:
    include:
      - infra/statefileBackend/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: 'latest'
  
stages:
  - stage: Checkout
    displayName: 'Checkout Code'
    jobs:
      - job: Checkout
        displayName: 'Checkout Code'
        steps:
          - checkout: self
            clean: true

  - stage: Terraform
    displayName: 'Terraform Operations' 
    dependsOn: Checkout
    jobs:
      - job: Terraform
        displayName: 'Terraform Operations'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
