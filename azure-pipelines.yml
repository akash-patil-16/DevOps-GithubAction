trigger: 
  branches:
    include:
      - feature
  paths:
    include:
      - infra/statefileBackend/**

pool:
  name: apatil-pool

stages:
  - stage: Validate
    displayName: validate code
    jobs:
      - job: Init
        displayName: Init Terraform
        steps:
        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'
            backendServiceArm: 'Azure subscription 1(05ff4ddb-aff1-402d-98e9-fb103401eee6)'
            backendAzureRmStorageAccountName: 'aptfstorageaccount'
            backendAzureRmContainerName: 'featuretf'
            backendAzureRmKey: 'featuretf'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'

  - stage: Scan
    displayName: Scan using Tfsec
    jobs: 
      - job: Scan
        displayName: Scan using Tfsec
        steps:
           - script: |
              tfsec . --format sarif --out tfsec-results.sarif
             displayName: 'Run tfsec Security Scan'
