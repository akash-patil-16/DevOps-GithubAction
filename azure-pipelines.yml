trigger: 
  branches:
    include:
      - feature
  paths:
    include:
      - infra/statefileBackend/**

pool:
  name: apatil-pool


parameters:
  - name: TFsec
    displayName: Scan TFsec
    type: boolean
    default: true

stages:
  - stage: Validate
    displayName: Validate code
    jobs:
      - job: Init
        displayName: Init Terraform
        steps:
        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'
            backendServiceArm: 'Azure subscription 1(05ff4ddb-aff1-402d-98e9-fb103401eee6)'
            backendAzureRmStorageAccountName: 'aptfstorageaccount'
            backendAzureRmContainerName: 'featuretf'
            backendAzureRmKey: 'featuretf'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'

  - stage: Scan_TFsec
    dependsOn: Validate
    condition: ${{ parameters.TFsec }}
    displayName: Scan using Tfsec
    jobs: 
      - job: Scan_TFsec
        displayName: Scan using Tfsec
        steps:
           - script: |
              tfsec . --format sarif --out tfsec-results.sarif --soft-fail
             displayName: 'Run tfsec Security Scan'

  - stage: Scan_Tflint
    dependsOn: Validate
    displayName: Scan using TFlint
    jobs:
      - job: Scan_Tflint
        steps:
          - script: |
              tflint --init
              tflint --format sarif > tflint-results.sarif || true
            displayName: 'Run TFLint Scan'
          
  - stage: Plan
    dependsOn:
    - Scan_TFsec
    - Scan_Tflint
    displayName: Terraform Plan
    jobs:
      - job: Plan
        displayName: Terraform Plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'
              backendServiceArm: 'Azure subscription 1(05ff4ddb-aff1-402d-98e9-fb103401eee6)'
              backendAzureRmStorageAccountName: 'aptfstorageaccount'
              backendAzureRmContainerName: 'featuretf'
              backendAzureRmKey: 'featuretf'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra/statefileBackend/'
              environmentServiceNameAzureRM: 'Azure subscription 1(05ff4ddb-aff1-402d-98e9-fb103401eee6)'

  - stage: Manual_approval
    pool: server
    dependsOn: Plan
    displayName: Manual Approval
    jobs:
      - job: Manual_approval
        displayName: Manual Approval 
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'akashpatil302.ap@gmail.com'