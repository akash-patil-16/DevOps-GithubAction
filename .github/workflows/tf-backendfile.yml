name: Terraform Dev Deploy

on:
  push:
    branches:
      - feature

  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_admin_username: ${{ secrets.VM_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.VM_PASSWORD }}
      
    defaults:
      run:
        working-directory: infra/statefileBackend

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          echo "Current Directory:"
          pwd
          echo "Repository Structure:"
          find $GITHUB_WORKSPACE -type f | sort

      - name: Show Terraform Files
        run: |
          pwd
          ls -la
          find . -name "*.tf"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
