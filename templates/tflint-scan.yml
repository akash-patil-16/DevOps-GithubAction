parameters:
  - name: GitTag
    type: string
    default: 'v1.0.0'
    
steps :
  - checkout: self
    fetchDepth: 0
    fetchTags: true
    persistCredentials: true

  - bash: |
      set -euo pipefail

      TAG="refs/tags/${GIT_TAG}"

      git fetch origin "$TAG"
      git checkout --detach FETCH_HEAD

      echo "Deploying Git tag: $GIT_TAG"
      git log -1 --oneline
    displayName: 'Checkout Selected Git Tag'
    env:
      GIT_TAG: ${{ parameters.GitTag }}

  - script: |
      tflint --init
      tflint --format sarif > tflint-results.sarif || true
    displayName: 'Run TFLint Scan'